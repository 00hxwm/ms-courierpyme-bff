services:
  bff-svc:
    build:
      context: ./ms-courierpyme-bff
    ports:
      - "8081:8081"
    networks:
      - courier-net

  shipments-svc:
    build:
      context: ./ms-courierpyme-shipments
    ports:
      - "8080:8080"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - courier-net

  catalog-svc:
    build:
      context: ./ms-courierpyme-catalog
    ports:
      - "8082:8082"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - courier-net

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    networks:
      - courier-net
    restart: unless-stopped

networks:
  courier-net:
    driver: bridge