services:
  bff-svc:
    build:
      context: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    networks:
      - courier-net
    restart: unless-stopped

  shipments-svc:
    build:
      context: ../ms-courierpyme-shipments
    env_file:
      - .env
    networks:
      - courier-net
    restart: unless-stopped

  catalog-svc:
    build:
      context: ../ms-courierpyme-catalog
    env_file:
      - .env
    networks:
      - courier-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    networks:
      - courier-net
    restart: unless-stopped

  notify-svc:
    build:
      context: ../ms-courierpyme-notify
    env_file:
      - .env
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - JAVA_OPTS=-Xmx256m
    depends_on:
      - rabbitmq
    networks:
      - courier-net
    restart: unless-stopped

  rabbit-admin-svc:
    build:
      context: ../ms-courierpyme-rabbit-admin
    container_name: rabbit-admin-svc
    env_file:
      - .env
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - JAVA_OPTS=-Xmx256m
    depends_on:
      - rabbitmq
    networks:
      - courier-net
    restart: unless-stopped

networks:
  courier-net:
    driver: bridge